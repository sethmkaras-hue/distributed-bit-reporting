[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bitmesh"
version = "0.1.0"
description = "Distributed volatile BIT agents, central archive and operations console"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "grpcio>=1.81.2,<2", "protobuf>=6.33.5,<7", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7", "websockets>=14,<16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "grpcio-tools>=1.81.2,<2", "ruff>=0.11,<1"]

[project.scripts]
bitmesh = "bitmesh.__main__:main"

[tool.setuptools.packages.find]
include = ["bitmesh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
